apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: codebattles
spec:
  clusterIP: None #headless, doesnt assign virtual load balance ip
  selector:
    app: postgres # select pod with postgress name, foward traffic to post with label app=postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: StatefulSet #mananges db, needs stable pod identity, persistant disk, existing data after restarts
metadata:
  name: postgres
  namespace: codebattles
spec:
  serviceName: postgres
  replicas: 1 #must always keep one pod running no matter what

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres #each pod would get label app=postgres. helps service find it

    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine #pull this postgres image

          ports:
            - name: postgres
              containerPort: 5432 #listens on this port

          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: codebattles-secrets
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: codebattles-secrets
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: codebattles-secrets
                  key: POSTGRES_DB

          readinessProbe:
            exec:
              command:
                - pg_isready
                - -h
                - 127.0.0.1
                - -p
                - "5432"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5

          livenessProbe:
            exec:
              command:
                - pg_isready
                - -h
                - 127.0.0.1
                - -p
                - "5432"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
