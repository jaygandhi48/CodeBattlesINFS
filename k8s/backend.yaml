apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: codebattles
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 3000
      targetPort: 3000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: codebattles
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: backend

      containers:
        - name: backend
          image: australia-southeast1-docker.pkg.dev/vocal-operand-505423-r1/codebattles/backend:v2
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000

          env:
            - name: NODE_ENV
              value: production

            - name: PORT
              value: "3000"

            - name: REDIS_URL
              value: redis://redis:6379

            - name: EXECUTION_SERVICE_URL
              value: http://execution-service:3001

            - name: EXECUTION_SERVICE_TIMEOUT_MS
              value: "120000"

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: codebattles-secrets
                  key: DATABASE_URL

          readinessProbe:
            httpGet:
              path: /api/healthcheck
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
